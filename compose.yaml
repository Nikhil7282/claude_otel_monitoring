# Server stack. No service publishes host ports here; compose.local.yaml and
# tests/compose.smoke.yaml expose them on localhost, and the production front door is
# added separately.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    environment:
      OTEL_AUTH_TOKEN: ${OTEL_AUTH_TOKEN:?set OTEL_AUTH_TOKEN in .env}
      COMPANY_ACCOUNTS: ${COMPANY_ACCOUNTS:?set COMPANY_ACCOUNTS in .env}
    volumes:
      - ./collector:/etc/otelcol-contrib:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=400d
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
