extensions:
  # Every Device sends this shared token; requests without it are refused.
  bearertokenauth:
    token: ${env:OTEL_AUTH_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth

processors:
  # Company Account allowlist. A data point is kept only when user.email exactly matches
  # one of these addresses; Personal Accounts and data with no email are dropped.
  filter/company-accounts:
    error_mode: propagate
    metrics:
      datapoint:
        - >-
          not (attributes["user.email"] == "company-one@example.com"
          or attributes["user.email"] == "company-two@example.org")
  batch: {}

exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    # device.id and host.name are resource attributes; without this they never become labels.
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [bearertokenauth]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [filter/company-accounts, batch]
      exporters: [prometheusremotewrite]
