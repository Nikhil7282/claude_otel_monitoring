# Production override for a server that already runs nginx on ports 80/443 (the Hostinger
# VPS). nginx terminates TLS (nginx/claude-otel.conf.template) and proxies to the Collector
# and Grafana on localhost-only ports, so nothing is reachable from outside except through
# nginx. Use with COMPOSE_FILE=compose.yaml:compose.nginx.yaml in .env.
services:
  otel-collector:
    ports:
      - 127.0.0.1:${COLLECTOR_PORT:-14317}:4317
    mem_limit: 192m

  prometheus:
    mem_limit: 384m

  grafana:
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-13000}:3000
    mem_limit: 256m
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:?set DOMAIN in .env}
